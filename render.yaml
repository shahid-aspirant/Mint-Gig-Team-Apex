services:
  # Backend API Web Service
  - type: web
    name: mintgig-api
    runtime: node
    plan: free
    rootDir: mintgig/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: mintgig-web
          property: host
      - key: ADMIN_SETUP_KEY
        generateValue: true

  # Frontend Static Site
  - type: web
    name: mintgig-web
    runtime: static
    plan: free
    rootDir: mintgig/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mintgig-api
          property: host
